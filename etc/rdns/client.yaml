listen:
  dns: "0.0.0.0:5353"
  sni: "0.0.0.0:14300"
  quic: "0.0.0.0:14400"

rules: /etc/rdns/rules.json

tls:
  ca_file: /etc/rdns/ca.crt
  cert_file: /etc/rdns/certs/node.crt
  key_file: /etc/rdns/certs/node.key

profiles:
  - name: my
    server: 87.76.160.181:443
    server_name: exit-my
    dns: 87.76.160.181:53

dns:
  default_upstream: "8.8.8.8:53"
  timeout: 3s
  query_size: 1232

reconnect:
  min: 1s
  max: 60s

tunnel_mark: 219750615
auto_local_ips: true
local_ip_refresh: 60s

logging:
  level: info
  file: /var/log/rdns-client.log
